<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>SovereignLab Weekly Game - Nov 16 - Nov 22, 2026</title>
<style>
:root{
  --bg:#f5f2ea; --card:#fffdf8; --ink:#1c2230; --muted:#586174; --line:#ddd6c5;
  --accent:#0f6b63; --accent-ink:#ffffff; --accent-soft:#dcefeb;
  --warn:#9a5208; --warn-soft:#f8e8d2; --bad:#b3261e; --bad-soft:#f9dedb;
  --good:#17703a; --good-soft:#dbf0e2; --chip:#ece6d6;
  --serif:Georgia,"Iowan Old Style","Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#10141c; --card:#1a2030; --ink:#eceff5; --muted:#a6b0c2; --line:#2c3549;
    --accent:#4cc0b3; --accent-ink:#06201d; --accent-soft:#173a38;
    --warn:#f0aa5c; --warn-soft:#3a2b17; --bad:#ff8c82; --bad-soft:#3d1f1d;
    --good:#74d68f; --good-soft:#18352a; --chip:#242c40;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans)}
main{max-width:760px;margin:0 auto;padding:16px 16px 56px}
h1,h2,h3{line-height:1.25;margin:0 0 .4em}
h1{font:700 1.6rem/1.2 var(--serif)}
h2{font:700 1.25rem/1.25 var(--serif)}
h3{font-size:1rem}
p{margin:0 0 .8em}
a{color:var(--accent)}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 14px}
.banner{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn);border-radius:10px;padding:8px 12px;margin:0 0 14px;font-weight:600;font-size:.9rem}
.top{display:flex;gap:12px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.brand{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.strip{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.rank{font-weight:700}
.bar{height:8px;background:var(--chip);border-radius:99px;overflow:hidden;min-width:120px;flex:1}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:620px){.grid{grid-template-columns:1fr}}
.mode{display:flex;flex-direction:column;gap:8px;margin:0}
.mode .tag{font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,summary:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:10px 16px;font-weight:700}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.opts{display:grid;gap:10px;margin:12px 0}
.opt{text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;min-height:48px;width:100%}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.correct{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.story{font:1.05rem/1.45 var(--serif);border-left:4px solid var(--accent);padding:2px 0 2px 12px;margin:10px 0}
.story .src{font:.8rem var(--sans);color:var(--muted);margin-top:4px}
.chip{display:inline-block;background:var(--chip);border-radius:99px;padding:2px 10px;font-size:.8rem;font-weight:600;margin:0 4px 4px 0}
.chip.up{background:var(--bad-soft);color:var(--bad)}
.chip.down{background:var(--good-soft);color:var(--good)}
.chip.flat{background:var(--chip)}
.feedback{border-radius:12px;padding:12px 14px;margin:12px 0}
.feedback.ok{background:var(--good-soft);border:1px solid var(--good)}
.feedback.no{background:var(--bad-soft);border:1px solid var(--bad)}
.feedback.info{background:var(--accent-soft);border:1px solid var(--accent)}
.prog{display:flex;gap:6px;margin:0 0 12px}
.prog i{flex:1;height:6px;border-radius:99px;background:var(--chip)}
.prog i.on{background:var(--accent)}
.stars{display:flex;gap:8px;flex-wrap:wrap}
.stars button{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:600}
.stars button.sel{border-color:var(--accent);background:var(--accent-soft)}
.meters{display:grid;gap:10px;margin:0 0 14px}
.meter{display:grid;grid-template-columns:130px 1fr 34px;gap:10px;align-items:center;font-size:.9rem}
@media (max-width:480px){.meter{grid-template-columns:96px 1fr 28px}}
.meter .bar{height:12px}
.meter .bar>i.low{background:var(--bad)}
.act{display:block;text-align:left;width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 10px}
.act:hover:not(:disabled){border-color:var(--accent)}
.act:disabled{opacity:.5;cursor:not-allowed}
.act.done{border-color:var(--good);background:var(--good-soft);opacity:1}
.act .t{font-weight:700}
.act .d{color:var(--muted);font-size:.875rem;margin-top:4px}
.cards2{display:grid;gap:10px}
.toast{background:var(--accent-soft);border:1px solid var(--accent);border-radius:12px;padding:10px 14px;margin:0 0 12px;font-size:.95rem}
details{margin:0 0 14px}
summary{cursor:pointer;font-weight:700;padding:6px 0}
table{border-collapse:collapse;width:100%;font-size:.9rem}
td,th{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
textarea{width:100%;min-height:70px;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:8px;font:.8rem monospace}
input[type=text]{width:100%;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:10px;font:inherit}
.chk label{display:block;padding:6px 0}
.chk input{width:18px;height:18px;vertical-align:middle}
.badges{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:480px){.badges{grid-template-columns:1fr}}
.badge{border:1.5px dashed var(--line);border-radius:10px;padding:8px 10px;opacity:.65}
.badge.on{border:1.5px solid var(--good);background:var(--good-soft);opacity:1}
.sr{position:absolute;left:-9999px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>

<script>
(function(){
"use strict";
var DATA = JSON.parse(document.getElementById("game-data").textContent);
var WK = DATA.week, CASE = DATA.case, TOWN = DATA.town;
var app = document.getElementById("app");

/* ---------- tiny DOM helper (text only, never HTML) ---------- */
function h(tag, attrs){
  var e = document.createElement(tag);
  if (attrs) Object.keys(attrs).forEach(function(k){
    var v = attrs[k];
    if (k === "class") e.className = v;
    else if (k === "on") Object.keys(v).forEach(function(ev){ e.addEventListener(ev, v[ev]); });
    else if (k === "text") e.textContent = v;
    else if (v !== false && v != null) e.setAttribute(k, v);
  });
  for (var i = 2; i < arguments.length; i++) add(e, arguments[i]);
  return e;
}
function add(e){
  for (var i = 1; i < arguments.length; i++) {
    var c = arguments[i];
    if (c == null || c === false) continue;
    if (Array.isArray(c)) { c.forEach(function(x){ add(e, x); }); continue; }
    e.appendChild(typeof c === "object" ? c : document.createTextNode(String(c)));
  }
}
function safeUrl(u){ return /^https?:\/\//i.test(u || "") ? u : ""; }
function link(label, url){
  var u = safeUrl(url);
  return u ? h("a", {href:u, target:"_blank", rel:"noopener noreferrer", text:label}) : document.createTextNode(label);
}

/* ---------- progress (browser storage, optional) ---------- */
var KEY = "sovereignlab_weekly_game_v1", mem = null;
function blank(){ return {xp:0, streak:0, maxStreak:0, org:null, lastWeek:-1, weeks:{}, picks:{}, sectors:{}, calib:{"1":[0,0],"2":[0,0],"3":[0,0]}}; }
function load(){
  try { var raw = localStorage.getItem(KEY); if (raw) return Object.assign(blank(), JSON.parse(raw)); } catch(e){}
  return mem || blank();
}
var P = load();
function fixOrg(){
  var o = P.org;
  if (!o || typeof o !== "object") { P.org = null; return; }
  o.name = String(o.name || "My organization").slice(0, 30);
  o.watch = Array.isArray(o.watch) ? o.watch.slice(0, 3) : [];
  ["practice","habits","real"].forEach(function(k){ if (!o[k] || typeof o[k] !== "object") o[k] = {}; });
  if (typeof o.cleared !== "number") o.cleared = -1;
  if (typeof o.lastRung !== "number") o.lastRung = 0;
  var L = o.life = (o.life && typeof o.life === "object") ? o.life : {};
  ["runs","prevented","missions","best"].forEach(function(k){ if (typeof L[k] !== "number") L[k] = 0; });
  if (!L.roles || typeof L.roles !== "object") L.roles = {};
  if (!L.grades || typeof L.grades !== "object") L.grades = {};
}
fixOrg();
function save(){ mem = P; try { localStorage.setItem(KEY, JSON.stringify(P)); } catch(e){} }
function exportCode(){ try { return btoa(unescape(encodeURIComponent(JSON.stringify(P)))); } catch(e){ return ""; } }
function importCode(code){
  try {
    var obj = JSON.parse(decodeURIComponent(escape(atob(code.trim()))));
    if (!obj || typeof obj.xp !== "number" || typeof obj.weeks !== "object") return false;
    P = Object.assign(blank(), obj); fixOrg(); save(); return true;
  } catch(e){ return false; }
}

function curIdx(){
  var d = new Date(), day = (d.getDay() + 6) % 7;
  var mon = new Date(d.getFullYear(), d.getMonth(), d.getDate() - day);
  return Math.floor(Math.round((mon - new Date(2024, 0, 1)) / 86400000) / 7);
}
var ARCHIVE = WK.index < curIdx();   /* an earlier week: no streak, no predictions */

var RANKS = [{n:"Rookie",xp:0,hints:3},{n:"Analyst",xp:60,hints:2},{n:"Senior Analyst",xp:160,hints:1},{n:"Chief Analyst",xp:320,hints:0}];
function rankIdx(xp){ var r = 0; RANKS.forEach(function(x,i){ if (xp >= x.xp) r = i; }); return r; }
function markWeekPlayed(){
  if (ARCHIVE || P.lastWeek === WK.index) return;
  P.streak = (P.lastWeek === WK.index - 1) ? P.streak + 1 : 1;
  P.lastWeek = WK.index;
  P.maxStreak = Math.max(P.maxStreak || 0, P.streak);
}
function weekRec(){ return P.weeks[WK.id] || (P.weeks[WK.id] = {}); }

/* ---------- shared pieces ---------- */
function header(){
  var r = rankIdx(P.xp), cur = RANKS[r], nxt = RANKS[r+1];
  var pct = nxt ? Math.round((P.xp - cur.xp) / (nxt.xp - cur.xp) * 100) : 100;
  return [
    DATA.sample ? h("div", {class:"banner", role:"note", text:"SAMPLE DATA. This copy is built from test stories, not real reporting."}) : null,
    h("div", {class:"top"},
      h("div", null, h("div", {class:"brand"}, "SovereignLab Weekly Game", DATA.archive_url ? [" · ", h("a", {href:DATA.archive_url, text:"All weeks"})] : null), h("h1", {text:"Week of " + WK.label})),
      h("div", {class:"strip"},
        h("span", {class:"rank", text:cur.n}),
        h("div", {class:"bar", role:"progressbar", "aria-label":"Progress to next rank", "aria-valuenow":pct, "aria-valuemin":0, "aria-valuemax":100}, h("i", {style:"width:" + pct + "%"})),
        h("span", {class:"small muted", text:P.xp + " XP" + (nxt ? " / " + nxt.xp : "")}),
        h("span", {class:"small muted", text:"Streak: " + P.streak + (P.streak === 1 ? " week" : " weeks")})))
  ];
}
function shell(){
  var kids = Array.prototype.slice.call(arguments);
  app.textContent = "";
  add(app, header());
  add(app, kids);
  window.scrollTo(0, 0);
}
function signalChip(sig){
  var cls = /Rising/.test(sig) ? "up" : /Easing/.test(sig) ? "down" : "flat";
  return h("span", {class:"chip " + cls, text:sig});
}
function storyBlock(s){
  return h("div", {class:"story"}, h("div", {text:s.text}),
    h("div", {class:"src"}, s.sector + " · ", link(s.outlet, s.url)));
}
function copyText(text, btn){
  var done = function(){ var old = btn.textContent; btn.textContent = "Copied"; setTimeout(function(){ btn.textContent = old; }, 1500); };
  try { navigator.clipboard.writeText(text).then(done, function(){ window.prompt("Copy this:", text); }); }
  catch(e){ window.prompt("Copy this:", text); }
}

/* ---------- HOME ---------- */
function home(){
  var rec = P.weeks[WK.id] || {};
  var pending = (CASE.resolutions || []).filter(function(r){ return P.picks[r.id] && !P.picks[r.id].resolved; });
  var caseDone = rec.case ? "Done this week: " + rec.case.right + " of " + rec.case.total : "Not played yet";
  var townDone = rec.town ? "Done this week: grade " + rec.town.grade : "Not played yet";
  shell(
    ARCHIVE ? h("div", {class:"toast", text:"You're playing an earlier week. XP counts, but streaks and predictions only apply to the current week."}) : null,
    pending.length ? h("div", {class:"toast"}, "Last week you made " + pending.length + " prediction" + (pending.length > 1 ? "s" : "") + ". Your results are waiting in Case Files.") : null,
    h("p", {class:"muted", text:"Every question and event below was built from the stories SovereignLab's sources produced this week (" + DATA.stories_this_week + " distinct stories). Same data as the Weekly Business Problem Brief. Nothing is sent anywhere."}),
    h("div", {class:"grid"},
      h("section", {class:"card mode"},
        h("div", {class:"tag", text:"Solo puzzles · about 8 minutes"}),
        h("h2", {text:"Case Files"}),
        h("p", {text:"Read the evidence. Sort stories under the right problem, spot the one that doesn't belong, and make predictions that get graded next week."}),
        h("p", {class:"small muted", text:caseDone}),
        h("button", {class:"btn", on:{click:startCase}, text:rec.case ? "Replay for practice" : "Open the case files"})),
      h("section", {class:"card mode"},
        h("div", {class:"tag", text:"Role-play · about 10 minutes"}),
        h("h2", {text:"Town Hall"}),
        h("p", {text:"Run your own organization (a cafe, a town, a school or a household) week after week. This week's real problems hit you; the low-cost playbook steps are your tools, and the ones you keep using become lasting habits."}),
        h("p", {class:"small muted", text:townDone}),
        h("button", {class:"btn", on:{click:townEnter}, text:rec.town ? "Replay for practice" : (P.org ? "Run the week" : "Take the job")}))),
    orgCard(),
    progressPanel());
}
function progressPanel(){
  var sectors = Object.keys(P.sectors);
  var rows = sectors.sort().map(function(s){
    var a = P.sectors[s], pct = a[1] ? Math.round(a[0] / a[1] * 100) : 0;
    return h("div", {class:"meter", style:"grid-template-columns:150px 1fr 54px"}, h("span", {text:s}), h("div", {class:"bar"}, h("i", {style:"width:" + pct + "%"})), h("span", {class:"small muted", text:a[0] + "/" + a[1]}));
  });
  var cal = ["1","2","3"].map(function(k){
    var c = P.calib[k]; var label = k === "1" ? "Not sure" : k === "2" ? "Fairly sure" : "Very sure";
    return h("tr", null, h("td", {text:label}), h("td", {text:c[1] ? Math.round(c[0] / c[1] * 100) + "% right" : "no graded calls yet"}), h("td", {class:"muted", text:c[1] + " graded"}));
  });
  var area = h("textarea", {readonly:"readonly", "aria-label":"Your progress code"}); area.value = exportCode();
  var paste = h("textarea", {"aria-label":"Paste a progress code to restore", placeholder:"Paste a progress code here to restore"});
  var msg = h("span", {class:"small muted"});
  return h("details", {class:"card"},
    h("summary", {text:"My progress"}),
    rows.length ? h("div", {class:"meters"}, h("h3", {text:"Mastery by sector"}), rows) : h("p", {class:"muted", text:"Play Case Files to start building sector mastery."}),
    h("h3", {text:"How well-calibrated are your predictions?"}),
    h("table", null, cal),
    h("p", {class:"small muted", text:"Good forecasters are right more often when they say they're very sure. Watch whether that holds for you."}),
    h("h3", {text:"Save or move your progress"}),
    h("p", {class:"small muted", text:"Your progress lives only in this browser. To keep it when you switch device or open a new week's file, copy the code below and paste it there."}),
    area,
    h("div", {class:"row", style:"margin:8px 0"},
      h("button", {class:"btn ghost", text:"Copy code", on:{click:function(e){ copyText(area.value, e.target); }}})),
    paste,
    h("div", {class:"row", style:"margin:8px 0"},
      h("button", {class:"btn ghost", text:"Restore", on:{click:function(){ msg.textContent = importCode(paste.value) ? "Restored." : "That code didn't work."; if (msg.textContent === "Restored.") setTimeout(home, 600); }}}), msg));
}

/* ---------- CASE FILES ---------- */
var C = null;
function startCase(){
  var pending = (CASE.resolutions || []).filter(function(r){ return P.picks[r.id] && !P.picks[r.id].resolved; });
  C = {qs:CASE.questions.filter(function(q){ return !(ARCHIVE && q.type === "predict"); }), i:0, right:0, scored:0, xp:0, hints:RANKS[rankIdx(P.xp)].hints, practice:!!(P.weeks[WK.id] && P.weeks[WK.id].case), hintShown:false, answered:false, conf:0, choice:null};
  if (pending.length) return resolveView(pending);
  caseQ();
}
function resolveView(list){
  var gained = 0;

  {id:"prepared", title:"Prepared mind", desc:"Prepare ahead for at least 4 problems before they arrive.", ok:function(){ return true; }, done:function(t){ return t.prepEvents >= 4; }},
  {id:"lean", title:"Lean operator", desc:"Beat half of casual play using at most one 2-point step.", ok:function(){ return true; }, done:function(t, pct){ return t.cost2 <= 1 && pct >= 0.5; }},
  {id:"watch", title:"Watchlist guardian", desc:"Take no damage from the problems on your watchlist.", ok:function(c){ return c.watchEvents > 0; }, done:function(t){ return t.watchDmg === 0; }},

  {id:"frugal", title:"Cheap and cheerful", desc:"Use only 1-point steps, and at least 6 of them.", ok:function(){ return true; }, done:function(t){ return t.cost2 === 0 && t.actions >= 6; }}
];
function missionById(id){ var m = null; MISSIONS.forEach(function(x){ if (x.id === id) m = x; }); return m; }
function mulberry(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hashStr(s){ var x = 2166136261; for (var i = 0; i < s.length; i++) { x ^= s.charCodeAt(i); x = Math.imul(x, 16777619); } return x >>> 0; }
function offeredMissions(){
  var o = P.org, sched = TOWN.schedule.map(function(id){ return TOWN.problems[id]; });
  var ctx = {
    rising: sched.filter(function(p){ return /Rising/.test(p.signal); }).length,
    watchEvents: sched.filter(function(p){ return o.watch.indexOf(p.id) >= 0; }).length,
    fresh: allSteps().filter(function(x){ return !o.habits[x.key] && o.practice[x.key] === undefined; }).length
  };
  var pool = MISSIONS.filter(function(m){ return m.ok(ctx); });
  var rnd = mulberry(hashStr(WK.id + "|" + o.name)), out = [];
  while (pool.length && out.length < 3) out.push(pool.splice(Math.floor(rnd() * pool.length), 1)[0]);

}

function hitStats(stats, stat, dmg){

  if (dmg > 0) {
    stats[stat] = clamp(stats[stat] - dmg); out.push([stat, dmg]);
    if (dmg >= 2) { var s2 = (stat + 1) % 3; stats[s2] = clamp(stats[s2] - 1); out.push([s2, 1]); }
  }
  return out;
}
function townEnter(){ if (!P.org) return orgSetup(townEnter); townReady(); }
function townReady(){
  var o = P.org, role = roleById(o.role), maxRung = Math.min(TOWN.ladder.length - 1, o.cleared + 1);
  if (RDY.rung === null) RDY.rung = Math.min(o.lastRung || 0, maxRung);

  });

    h("div", {class:"small muted", text:"Ready to run"}), h("h2", {text:o.name}),
    h("p", {text:role.name + " · " + levelOf().n + " · " + hc + " standing habit" + (hc === 1 ? "" : "s") + (hc ? ". Your habits will protect you automatically." : ". Use a step in 3 different weeks to turn it into a habit.")}),

      h("button", {class:"btn", type:"button", text:"Start the week", on:{click:function(){ startTown(role, RDY.rung, RDY.mission); }}}),
      h("button", {class:"btn ghost", type:"button", text:"My organization", on:{click:orgPage}}),
      h("button", {class:"btn ghost", type:"button", text:"Back", on:{click:home}}))));
}
function startTown(role, rung, missionId){

function curProblem(i){ var id = TOWN.schedule[i]; return id ? TOWN.problems[id] : null; }
function expectedDamage(p){ return Math.max(0, sevOf(p) - T.shield - (T.prep[p.id] || 0) - habitShieldFor(p, T.habits)); }
function sign(n){ return (n > 0 ? "+" : "") + n; }
function effChips(sol){

  sol.eff.forEach(function(v, k){ if (v) out.push(h("span", {class:"chip " + (v > 0 ? "down" : "up"), text:sign(v) + " " + T.role.labels[k]})); });
  return out;
}
function townTurn(){

  var meters = h("div", {class:"meters"}, T.role.labels.map(function(lab, k){
    var v = T.stats[k];
    return h("div", {class:"meter"}, h("span", {text:lab}), h("div", {class:"bar", role:"progressbar", "aria-label":lab, "aria-valuenow":v, "aria-valuemin":0, "aria-valuemax":10}, h("i", {class:v <= 3 ? "low" : "", style:"width:" + v * 10 + "%"})), h("strong", {text:v}));
  }));
  var dmg = expectedDamage(p), hs = habitShieldFor(p, T.habits);
  var mission = T.mission ? missionById(T.mission) : null;
  var ev = h("section", {class:"card"},
    h("div", {class:"small muted", text:"Turn " + (T.t + 1) + " of " + TOWN.turns + " · " + P.org.name + " · " + T.ladder.name + (mission ? " · Mission: " + mission.title : "")}),
    h("h2", {text:p.name}),
    h("div", null, signalChip(p.signal), h("span", {class:"chip", text:p.count + " stories this week (" + p.prev + " last week)"}), P.org.watch.indexOf(p.id) >= 0 ? h("span", {class:"chip", text:"On your watchlist"}) : null),
    p.story ? [h("p", {class:"small muted", style:"margin:8px 0 0", text:"In the news this week:"}), storyBlock(p.story)] : h("p", {text:p.why}),
    h("p", {class:"small"}, "This hits your ", h("strong", {text:T.role.labels[p.stat]}), " by up to ", h("strong", {text:sevOf(p)}), " when the turn ends (2 or more spills into a second area). ",
      hs ? "Your standing habits already absorb " + hs + ". " : "",
      h("strong", {text:dmg === 0 ? "You're fully protected." : "Expected damage right now: " + dmg + "."})),
    nx ? h("p", {class:"small muted", text:"Forecast: next turn brings " + nx.name + " (" + nx.signal + ")."}) : h("p", {class:"small muted", text:"Final turn."}));
  var acts = h("section", {class:"card"},
    h("h3", {text:"Action points left: " + T.pts}),
    h("p", {class:"small muted", text:"Each step helps in its own way. Steps for this turn's problem also block its damage now. Steps for next turn's problem block its damage when it arrives. Use a step in 3 different weeks and it becomes a free standing habit."}),
    h("h3", {text:"Respond now: " + p.name}), solCards(p, true),
    nx ? [h("h3", {style:"margin-top:14px", text:"Prepare for next turn: " + nx.name}), solCards(nx, false)] : null,
    h("div", {style:"margin-top:12px"}, h("button", {class:"btn", type:"button", text:T.t + 1 < TOWN.turns ? "End turn" : "End the final turn", on:{click:endTurn}})));

function solCards(p, respond){
  return h("div", null, p.solutions.map(function(s, idx){
    var key = stepKey(p.id, idx), used = !!T.used[key], habit = !!T.habits[key];
    return h("button", {class:"act" + ((used || habit) ? " done" : ""), type:"button", disabled:(used || habit || s.cost > T.pts) ? "disabled" : false, on:{click:function(){ act(p, idx, respond); }}},
      h("div", {class:"t", text:s.title + (habit ? " (standing habit)" : used ? " (done)" : "")}),
      h("div", null, habit ? h("span", {class:"chip down", text:"Free and automatic"}) : effChips(s)),
      h("div", {class:"d", text:s.detail}));
  }));
}
function act(p, idx, respond){
  var s = p.solutions[idx], key = stepKey(p.id, idx);
  if (T.used[key] || T.habits[key] || s.cost > T.pts) return;
  T.used[key] = 1; T.pts -= s.cost;
  s.eff.forEach(function(v, k){ T.stats[k] = clamp(T.stats[k] + v); });
  T.minStat = Math.min(T.minStat, Math.min.apply(null, T.stats));
  if (respond) T.shield += s.cost; else T.prep[p.id] = (T.prep[p.id] || 0) + s.cost;
  T.acts.push({title:s.title, respond:respond, pid:p.id});
  T.actions++; if (s.cost >= 2) T.cost2++;
  if (P.org.practice[key] === undefined) T.newUsed++;
  T.last = null;
  townTurn();
}
function endTurn(){
  var p = curProblem(T.t), sev = sevOf(p), pre = T.shield + (T.prep[p.id] || 0), habit = habitShieldFor(p, T.habits);
  var dmg = Math.max(0, sev - pre - habit), without = Math.max(0, sev - pre);
  var hits = hitStats(T.stats, p.stat, dmg).map(function(x){ return T.role.labels[x[0]] + " -" + x[1]; });
  T.minStat = Math.min(T.minStat, Math.min.apply(null, T.stats));
  T.prevented += without - dmg;
  if (T.prep[p.id]) T.prepEvents++;
  if (/Rising/.test(p.signal)) T.risingDmg += dmg;
  if (P.org.watch.indexOf(p.id) >= 0) T.watchDmg += dmg;
  T.log.push({name:p.name, signal:p.signal, sev:sev, blocked:Math.min(pre + habit, sev), dmg:dmg, habit:habit, acts:T.acts.slice(), story:p.story});
  T.last = "Last turn, " + p.name + " " + (dmg ? "hit you: " + hits.join(", ") + "." : "was fully absorbed. Nothing lost.") + (without - dmg > 0 ? " Your habits prevented " + (without - dmg) + "." : "");

function radar(){
  var rows = TOWN.order.map(function(id){
    var p = TOWN.problems[id];
    return h("tr", null, h("td", {text:p.name}), h("td", null, signalChip(p.signal)), h("td", {text:p.count + " / " + p.prev}));
  });

    h("table", null, h("tr", null, h("th", {text:"Problem"}), h("th", {text:"Signal"}), h("th", {text:"Stories"})), rows));
}

/* Casual-play benchmark: the same week, role, level and habits, with random choices. */
function benchmark(role, bonus, habits, n){
  var rnd = mulberry(hashStr(WK.id + "|" + role.id + "|" + bonus + "|" + Object.keys(habits).sort().join(",")));
  var totals = [];
  for (var r = 0; r < n; r++) {
    var st = role.start.slice(), prep = {};
    for (var t = 0; t < TOWN.turns; t++) {
      var p = TOWN.problems[TOWN.schedule[t]], nx = TOWN.problems[TOWN.schedule[t + 1]] || null, pts = TOWN.points, shield = 0, opts = [];
      p.solutions.forEach(function(s, i){ if (!habits[stepKey(p.id, i)]) opts.push({p:p, s:s, resp:true}); });
      if (nx) nx.solutions.forEach(function(s, i){ if (!habits[stepKey(nx.id, i)]) opts.push({p:nx, s:s, resp:false}); });
      for (;;) {
        var aff = opts.filter(function(o){ return o.s.cost <= pts; });
        if (!aff.length) break;
        var o = aff[Math.floor(rnd() * aff.length)];
        opts.splice(opts.indexOf(o), 1); pts -= o.s.cost;
        o.s.eff.forEach(function(v, k){ st[k] = clamp(st[k] + v); });
        if (o.resp) shield += o.s.cost; else prep[o.p.id] = (prep[o.p.id] || 0) + o.s.cost;
      }
      hitStats(st, p.stat, Math.max(0, p.sev + bonus - shield - (prep[p.id] || 0) - habitShieldFor(p, habits)));
    }
    totals.push(st[0] + st[1] + st[2]);
  }
  return totals;
}
function gradeFor(total, pct){

  if (total <= 0) return "F";
  return pct >= g.A ? "A" : pct >= g.B ? "B" : pct >= g.C ? "C" : pct >= g.D ? "D" : "F";
}
function townEnd(){

      else if (!o.habits[key]) trained.push(key);

    o.lastRung = T.rung;

  var rows = T.log.map(function(l, k){
    return h("tr", null, h("td", {text:String(k + 1)}), h("td", null, l.name, h("div", {class:"small muted", text:l.signal})),
      h("td", {text:(l.habit ? "Habits (" + l.habit + ")" + (l.acts.length ? "; " : "") : "") + (l.acts.length ? l.acts.map(function(a){ return a.title; }).join("; ") : (l.habit ? "" : "No action"))}),

  var shareBtn = h("button", {class:"btn ghost", type:"button", text:"Copy my result"}); shareBtn.addEventListener("click", function(){ copyText(share, shareBtn); });

    h("h2", {text:"Grade " + grade + ": " + total + " out of 30"}),
    h("p", {text:T.role.labels.map(function(lab, k){ return lab + " " + T.stats[k]; }).join(" · ") + " · " + T.ladder.name + " level"}),
    h("p", {text:"Better than " + Math.round(pct * 100) + "% of casual play on this same setup."}),
    h("p", {text:T.practice ? "Practice run: no XP and no progress this time." : "You earned " + xp + " XP."}),
    T.prevented > 0 ? h("p", {class:"feedback ok", text:"Your standing habits prevented " + T.prevented + " damage this run."}) : null,
    formed.length ? h("div", {class:"feedback ok"}, h("strong", {text:"New standing habit" + (formed.length > 1 ? "s" : "") + " (+10 XP each)"}), h("ul", {style:"margin:6px 0 0;padding-left:18px"}, formed.map(function(k){ return h("li", {text:stepByKey[k].s.title}); })), h("p", {class:"small", text:"These now protect you for free every time that problem hits."})) : null,
    trained.length ? h("p", {class:"small muted", text:"In training: " + trained.slice(0, 4).map(function(k){ return stepByKey[k].s.title + " (" + o.practice[k].length + " of " + TOWN.habit_weeks + " weeks)"; }).join("; ") + (trained.length > 4 ? "; and " + (trained.length - 4) + " more." : ".")}) : null,
    mission ? h("p", {class:"feedback " + (missionOk ? "ok" : "no"), text:"Mission \"" + mission.title + "\": " + (missionOk ? "complete" + (T.practice ? "." : " (+15 XP).") : "not this time. " + mission.desc)}) : null,
    unlocked ? h("p", {class:"feedback info", text:"New level unlocked: " + unlocked + "."}) : null,

    h("h3", {text:"Your eight turns"}),
