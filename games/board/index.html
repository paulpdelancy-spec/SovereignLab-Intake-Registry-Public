<style>
:root{--bg:#0f1720;--card:#18232f;--ink:#e8eef4;--mut:#9fb0c0;--acc:#4cc2a1;--warn:#f0b24c;--bad:#ef6b6b;--line:#2a3a4a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}h1{font-size:1.4rem;margin:.2em 0}h2{font-size:1.1rem;margin:.8em 0 .3em}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.mut{color:var(--mut);font-size:.9rem}.tag{font-size:.75rem;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--mut)}
button,select,input,textarea{font:inherit;color:var(--ink);background:#0f1b26;border:1px solid var(--line);border-radius:8px;padding:8px 12px}
button{cursor:pointer;background:var(--acc);color:#06221a;border:0;font-weight:600}button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:400}button.danger{background:var(--bad);color:#2a0b0b}
button:disabled{opacity:.5;cursor:default}textarea{width:100%;min-height:90px}input[type=text],input[type=password],select{width:100%}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.tabs button{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:400}.tabs button.on{background:var(--acc);color:#06221a;border-color:var(--acc);font-weight:600}
.post{border-top:1px solid var(--line);padding:10px 0}.post:first-child{border-top:0}.body{white-space:pre-wrap;word-break:break-word}
.reply{margin-inline-start:18px;border-inline-start:2px solid var(--line);padding-inline-start:10px}
.note{border-inline-start:4px solid var(--warn);background:#2a2415;padding:8px 12px;border-radius:6px;margin:8px 0}.err{color:var(--bad)}.okc{color:var(--acc)}
.msg{padding:6px 0}.me{text-align:end}.chat{max-height:50vh;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px;background:#0f1b26}
code{background:#0f1b26;padding:1px 6px;border-radius:4px;word-break:break-all}
label{display:block;margin:6px 0}.legal{margin:24px 0;color:var(--mut);font-size:.8rem}
</style>
</head>

<script>
function slScrub(input) {
  var found = {}, t = String(input == null ? "" : input);
  function hit(label) { found[label] = (found[label] || 0) + 1; return "[" + label + " hidden]"; }
  function rep(re, label, ok) { t = t.replace(re, function (m) { return (ok && !ok(m)) ? m : hit(label); }); }
  function digits(s) { return s.replace(/\D/g, ""); }
  function luhn(s) { var d = digits(s), sum = 0, alt = false; if (d.length < 13 || d.length > 19) return false;
    for (var i = d.length - 1; i >= 0; i--) { var n = +d[i]; if (alt) { n *= 2; if (n > 9) n -= 9; } sum += n; alt = !alt; } return sum % 10 === 0; }
  rep(/#k=\S+/g, "private key");
  rep(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/gi, "email");
  rep(/\b(?:https?:\/\/|www\.)\S+/gi, "link");
  rep(/\b[a-z0-9-]+(?:\.[a-z0-9-]+)*\.(?:com|net|org|io|co|gov|edu|info|me|app|dev|ai|us|uk|de|fr|ru|cn|xyz|ly|ca|au|in|jp|kr|nl|br)(?:\/\S*)?(?![a-z0-9])/gi, "link");
  rep(/\b(?:\d[ -]?){13,19}\b/g, "card number", luhn);
  rep(/\b\d{3}[- ]\d{2}[- ]\d{4}\b/g, "ID number");
  rep(/\b(?:\d{1,3}\.){3}\d{1,3}\b/g, "IP address");
  rep(/\+?\d[\d\s().-]{7,}\d/g, "phone number", function (m) { var n = digits(m).length; return n >= 9 && n <= 15 && (/[\s().-]/.test(m) || m[0] === "+" || n >= 10); });
  rep(/\b\d{1,5}\s+(?:[A-Za-z0-9.'-]+\s+){1,3}(?:street|st|avenue|ave|road|rd|boulevard|blvd|lane|ln|drive|dr|court|ct|way|place|pl|terrace|circle|highway|hwy)\b\.?/gi, "address");
  rep(/\b[A-Z]{2}\s\d{5}(?:-\d{4})?\b/g, "address");
  rep(/\b(?:my (?:full |real |first |last )?name is|i am called|call me|i'm called)\s+[A-Z][\w'-]+(?:\s+[A-Z][\w'-]+)?/g, "name");
  rep(/\bi (?:live|reside|work|stay)\s+(?:at|on|near)\s+[^.,;\n]{3,40}/gi, "location");
  rep(/\b(?:born|dob|d\.o\.b\.?|birthday|birthdate)\b[^.\n]{0,20}\d{1,4}[\/.-]\d{1,2}[\/.-]\d{1,4}/gi, "birth date");
  rep(/\b(?:born|dob|birthday)\b[^.\n]{0,12}(?:jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s+\d{1,2},?\s+\d{4}/gi, "birth date");
  rep(/\b(?:ghp|gho|github_pat|glpat|sk|pk|xox[bap]|AKIA|hf)[_-]?[A-Za-z0-9_\-]{10,}/g, "secret");
  rep(/[A-Za-z0-9+\/=_-]{32,}/g, "secret");
  rep(/(^|[\s(])@[A-Za-z0-9_.]{2,}/g, "handle");
  return { text: t, found: found, count: Object.keys(found).reduce(function (a, k) { return a + found[k]; }, 0) };
}

(function () {

// ---- layout ----

  h("p", { class: "legal" }, "© 2026 SovereignLab. Share game strategy, not personal details. A learning community, not financial, legal or professional advice.")]); }

  if (!S && m) return joinScreen(m[1]);
  if (!S) return noInvite();
  api("GET", "/api/me").then(function (me) { S.adult = me.adult; S.helpful = me.helpful; S.trusted = me.trusted; save(); main(); }, function (e) { if (e.status === 401) { S = null; save(); noInvite("Your sign-in is no longer valid. Use your invite link, or restore from a backup code."); } else gate(e.message); });

function noInvite(note) {

  gate(note || "The board is open to SovereignLab subscribers. Your invite link arrives by email.", h("div", null, [h("h2", null, "Already joined on another device?"), code, pw,
    h("p", null, h("button", { on: { click: function () { restore(code.value.trim(), pw.value, msg); } } }, "Restore my account")), msg]));
}
function joinScreen(inv) {
  var age = "", msg = h("p", { class: "err" }), btn = h("button", { disabled: true, on: { click: go } }, "Join the board");

  [["board", "Board"], ["groups", "Private groups"], ["rules", "Rules"], ["me", "Me"]].forEach(function (t) { add(tabs, h("button", { class: view === t[0] ? "on" : "", on: { click: function () { view = t[0]; main(); } } }, t[1])); });
  var rk = rank(S.helpful || 0);
  frame(h("div", null, [h("div", { class: "row" }, [h("span", null, ["You are ", h("strong", null, S.handle)]), rk ? h("span", { class: "tag" }, rk) : null, h("span", { class: "tag" }, S.adult ? "18+" : "13-17")]), tabs, body]));
  if (view === "board") boardView(body); else if (view === "groups") groupsView(body); else if (view === "rules") rulesView(body); else meView(body, firstTime);
}

// ---- board ----
var boardCat = "", pendingCard = null;
(function () { var m = /[#&]share=([A-Za-z0-9+\/=_-]{4,1500})/.exec(location.hash); if (m) { try { var c = JSON.parse(dec.decode(b64d(m[1].replace(/-/g, "+").replace(/_/g, "/")))); if (c && (c.kind === "town" || c.kind === "case")) pendingCard = c; } catch (e) {} } })();
function boardView(root) {

  var cat = h("select", null, CATS.filter(function (c) { return c[0] !== "runs" || pendingCard; }).map(function (c) { return h("option", { value: c[0] }, c[1]); }));
  if (pendingCard) cat.value = "runs";
  var week = h("input", { type: "text", value: pendingCard && pendingCard.week ? pendingCard.week : isoWeek(new Date()), maxlength: "8", "aria-label": "Game week" });
  var ta = h("textarea", { maxlength: "1200", placeholder: "Share a tip, a strategy, a highlight, or ask a question about the game...", "aria-label": "Your post" }), prev = h("p", { class: "mut" });
  ta.addEventListener("input", function () { var r = slScrub(ta.value); prev.textContent = r.count ? "These will be hidden before posting: " + Object.keys(r.found).join(", ") + "." : ""; });
  var send = h("button", { on: { click: function () { post(null, cat.value, week.value, ta, msg, send, true); } } }, "Post");
  var card = pendingCard ? h("div", { class: "note" }, "Your run summary is attached: " + cardText(pendingCard)) : null;
  add(root, h("div", { class: "card" }, [h("div", { class: "row" }, [h("div", { style: "flex:1;min-width:140px" }, cat), h("div", { style: "width:110px" }, week)]), card, ta, prev, h("div", { class: "row" }, [send, msg])]));
  var filt = h("div", { class: "tabs" }); [["", "All"]].concat(CATS).forEach(function (c) { add(filt, h("button", { class: boardCat === c[0] ? "on" : "", on: { click: function () { boardCat = c[0]; main(); } } }, c[1])); });

function cardText(c) { return (c.kind === "town" ? "Town Hall" : "Case Files") + (c.week ? " " + c.week : "") + (c.level ? ", " + c.level : "") + (c.role ? ", " + c.role : "") + (c.grade ? ", grade " + c.grade : "") + (c.steps && c.steps.length ? ". Steps: " + c.steps.join(", ") : ""); }

function postEl(p) {

  add(box, [h("div", { class: "row" }, [h("strong", null, p.handle), rk ? h("span", { class: "tag" }, rk) : null, h("span", { class: "tag" }, p.category), p.week ? h("span", { class: "tag" }, p.week) : null, h("span", { class: "mut" }, ago(p.created)), p.status === "pending" ? h("span", { class: "tag" }, "awaiting review") : null]),
    p.card ? h("div", { class: "note" }, cardText(p.card)) : null, h("div", { class: "body" }, p.body), act, rep]);
  if (p.status === "live" && !p.mine) add(act, h("button", { class: "ghost", on: { click: function (ev) { var b = ev.target; api("POST", "/api/posts/" + p.id + "/helpful").then(function () { b.textContent = "Thanks! Marked helpful"; b.disabled = true; }, function (e) { b.textContent = e.message; }); } } }, p.voted ? "Marked helpful" : "Helpful (" + p.helpful + ")"));

// ---- private groups ----
function stopPoll() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }
function groupsView(root) {
